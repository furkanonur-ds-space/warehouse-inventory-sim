function resize(){

/* World (Gazebo ENU: x east, y north, z up) -> camera -> screen.
   The camera orbits the target; world +Z is up. */
function project(p){
  const ca=Math.cos(az), sa=Math.sin(az), ce=Math.cos(el), se=Math.sin(el);
  const eye=[target[0]+dist*ce*ca, target[1]+dist*ce*sa, target[2]+dist*se];
  const f=[target[0]-eye[0], target[1]-eye[1], target[2]-eye[2]];
  const fl=Math.hypot(...f); const fw=f.map(v=>v/fl);
  // right = forward x up(0,0,1); up = right x forward
  let r=[fw[1], -fw[0], 0]; const rl=Math.hypot(...r)||1; r=r.map(v=>v/rl);
  const u=[r[1]*fw[2]-r[2]*fw[1], r[2]*fw[0]-r[0]*fw[2], r[0]*fw[1]-r[1]*fw[0]];
  const d=[p[0]-eye[0], p[1]-eye[1], p[2]-eye[2]];
  const z=d[0]*fw[0]+d[1]*fw[1]+d[2]*fw[2];
  if(z<=0.05) return null;                       // behind the camera
  const x=d[0]*r[0]+d[1]*r[1]+d[2]*r[2];
  const y=d[0]*u[0]+d[1]*u[1]+d[2]*u[2];
  const fov=Math.min(W,H)*0.9;
  return [W/2 + fov*x/z, H/2 - fov*y/z, z];

}

  const [x,y,z]=c, [a,b,d]=h;

/* Position error -> colour. Green at or under GOOD, red at or over BAD.
   Without ground truth every dot is neutral blue: the view still shows where

const GOOD=0.10, BAD=0.25;
// Drift arrows are centimetres long in a twenty metre warehouse; without a
// scale factor they are a single pixel.
const DRIFT_SCALE=10;

// the label is, and a filled dot where the scan put it. The line between them
// IS the shift, so it is shown for all of them by default rather than only for
// the large ones - the question this view is asked is "how far off are we",
// and hiding the small ones answers it with a blank. 'v' raises the threshold
// when the picture gets too busy to read.
const VEC_STEPS=[0.0,0.05,0.15,Infinity];

// "-3.0" next to "+1.2" reads as a direction.
function sgn(v){ return `${v>=0?'+':''}${(v*100).toFixed(1)}`; }

  if(e===undefined||e===null) return 'rgb(90,150,220)';
  const t=Math.max(0,Math.min(1,(e-GOOD)/(BAD-GOOD)));

let screenPts=[];
function draw(){
  ctx.fillStyle='#11151c'; ctx.fillRect(0,0,W,H);

  // floor grid, 2 m
  for(let x=D.bounds[0]; x<=D.bounds[1]+0.01; x+=2)
    line([x,D.bounds[2],0],[x,D.bounds[3],0],'#1e2836');

  line([0,0,0],[0,0,3],'#5b8dfc',2.5);

  // rack cells
  for(const b of D.racks)
    for(const e of boxEdges(b.c,b.h)) line(e[0],e[1],'#33455e',1);

  for(const m of D.markers){
    const s=m.size/2;
    line([m.x-s,m.y-s,0.01],[m.x+s,m.y-s,0.01],'#4fd6d6',1.6);
    line([m.x+s,m.y-s,0.01],[m.x+s,m.y+s,0.01],'#4fd6d6',1.6);
    line([m.x+s,m.y+s,0.01],[m.x-s,m.y+s,0.01],'#4fd6d6',1.6);
    line([m.x-s,m.y+s,0.01],[m.x-s,m.y-s,0.01],'#4fd6d6',1.6);
    // Mean drift measured here, at DRIFT_SCALE so a 3 cm error is visible at
    // warehouse scale. Drawn standing up from the marker so it does not
    // disappear into the floor grid.
    if(m.drift_e!==undefined){
      const a=[m.x,m.y,0.02], b=[m.x+m.drift_e*DRIFT_SCALE, m.y+m.drift_n*DRIFT_SCALE, 0.02];
      line(a,b,'#ff9f43',2);
      const q=project(b);
      if(q){ ctx.fillStyle='#ff9f43'; ctx.font='11px system-ui';
             ctx.fillText(`${(m.median*100).toFixed(1)} cm`, q[0]+5, q[1]-3); }
    }
  }

  // products, far to near (painter's algorithm)
  screenPts=[];
  const pts=[];
  for(const it of D.items){
    const p=project([it.x,it.y,it.z]); if(!p) continue;
    pts.push([p,it]);

      if(q){

        // so the coloured dot beside it reads as the measurement and this

    s+=`<div style="font-size:12px;color:#8b98a9;margin-bottom:6px">
        drift at marker fix: median ${(D.drift.median*100).toFixed(1)} cm ·
        p95 ${(D.drift.p95*100).toFixed(1)} cm · max ${(D.drift.max*100).toFixed(1)} cm<br>
        ${D.drift.fixes} fixes · final offset ${(D.drift.final*100).toFixed(1)} cm</div>`;
  }
  if(D.truth){
    s+=`<span class="k" style="background:${errColor(0.05)}"></span>within 10 cm<br>`;
    s+=`<span class="k" style="background:${errColor(0.30)}"></span>over 25 cm out<br>`;
    if(m) s+=`<span class="k sq"></span>never decoded, drawn at its real size<br>`;
    s+=`<span class="k" style="background:none;border:1px solid ${COL_TRUTH};
        border-radius:0"></span>true position (ground truth)<br>`;
    s+=`<span class="k" style="background:#ffb020"></span>shift, truth to estimate
        (${VEC_MIN===Infinity?'off':VEC_MIN===0?'all':'&gt;'+(VEC_MIN*100).toFixed(0)+' cm'},
        key v)<br>`;
  } else {
    s+=`<span class="k" style="background:${errColor(null)}"></span>estimated position<br>`;
  }
  s+=`<span class="k" style="background:#4fd6d6"></span>floor marker<br>`;
  if(D.drift) s+=`<span class="k" style="background:#ff9f43"></span>drift at
      that marker (x${DRIFT_SCALE})<br>`;
  s+=`<span style="color:#e05252">■</span> X &nbsp;<span style="color:#52c65c">■</span> Y
      &nbsp;<span style="color:#5b8dfc">■</span> Z`;
  if(D.stats) s+=`<br><span style="font-size:12px;color:#8b98a9">${D.stats}</span>`;
  document.getElementById('hud').innerHTML=s;
}

// --------------------------------------------------------------- interaction
let drag=null;
cv.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,b:e.button};
  cv.classList.add('drag');});
window.addEventListener('mouseup',()=>{drag=null;cv.classList.remove('drag');});
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('mousemove',e=>{
  if(drag){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    drag.x=e.clientX; drag.y=e.clientY;
    if(drag.b===2){                                  // pan
      const ca=Math.cos(az), sa=Math.sin(az), k=dist*0.0016;
      target[0]+= (sa*dx)*k; target[1]+= (-ca*dx)*k; target[2]+= dy*k;
    } else {
      az-=dx*0.006; el=Math.max(-1.45,Math.min(1.45, el+dy*0.006));
    }
    draw(); return;
  }
  const t=document.getElementById('tip');
  let best=null, bd=1e9;
  for(const [x,y,r,it] of screenPts){
    const d=Math.hypot(e.clientX-x, e.clientY-y);
    if(d<Math.max(7,r+4) && d<bd){ bd=d; best=it; }
  }
  if(!best){ t.style.display='none'; return; }
  let h=`<b>${best.id}</b><br>${best.qr}<br>`
      + `${best.shelf}-${String(best.bay).padStart(2,'0')}-L${best.level}<br>`
      + `x ${best.x.toFixed(2)}  y ${best.y.toFixed(2)}  z ${best.z.toFixed(2)}`;
  if(best.size)
    h+=`<br>box ${best.size[0].toFixed(2)} x ${best.size[1].toFixed(2)} x `
      +`${best.size[2].toFixed(2)} m  (${best.vol.toFixed(3)} m³)`;
  if(best.zoff!==undefined && best.zoff!==null)
    h+=`<br>label ${best.zoff>=0?'+':''}${(best.zoff*100).toFixed(0)} cm off the `
      +`optical axis${Math.abs(best.zoff)>0.23?' <span style="color:#ff4d6d">'
      +'(outside the frame)</span>':''}`;
  if(best.ppm!==undefined) h+=`<br>${best.ppm.toFixed(2)} px per QR module`;
  if(best.missed) h+=`<br><span style="color:#ff4d6d">NEVER DECODED</span>`;
  else if(best.err!==undefined){
    h+=`<br>position error ${(best.err*100).toFixed(1)} cm`;
    // Both positions, then the signed shift between them. Reading the two
    // coordinates next to each other is what makes a systematic offset
    // obvious; the delta alone does not say which one moved.
    if(best.tx!==undefined)
      h+=`<br><span style="color:${COL_TRUTH}">true  x ${best.tx.toFixed(2)}  `
        +`y ${best.ty.toFixed(2)}  z ${best.tz.toFixed(2)}</span>`;
    if(best.d) h+=`<br>shift dx ${sgn(best.d[0])} dy ${sgn(best.d[1])} `
                 +`dz ${sgn(best.d[2])} cm`;
  }
  if(best.truth_at) h+=`<br><span style="color:#8b98a9">truth ${best.truth_at}</span>`;
  t.innerHTML=h; t.style.display='block';
  t.style.left=(e.clientX+14)+'px'; t.style.top=(e.clientY+12)+'px';
});
window.addEventListener('keydown',e=>{
  if(e.key==='v'||e.key==='V'){
    vecStep=(vecStep+1)%VEC_STEPS.length; VEC_MIN=VEC_STEPS[vecStep]; draw();
  }
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  dist=Math.max(4,Math.min(90, dist*(e.deltaY>0?1.1:0.9))); draw();
},{passive:false});
resize();
</script>
